<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청라 내신 분석실</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C8202B"><link rel="icon" href="icon-192.png"></head>
<body>
<title>청라 내신 분석실</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#C8202B"><link rel="icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar with tabs, single content column (max 1180px), tables scroll inside their own wrappers */
:root{
  /* 학원 로고 색: 레드(--accent)와 차콜(--dark). 막대·띠그래프는 차콜이 기본, 강조(고난도·서답형)는 레드 */
  --bg:#f1f2f3; --surface:#ffffff; --surface2:#f6f6f7; --ink:#1f2123; --muted:#62686d; --line:#dcdee0;
  --accent:#c8202b; --accent-ink:#ffffff; --accent-soft:#fbe6e8; --hot:#c8202b; --hot-soft:#fbe6e8;
  --dark:#3b3d3f; --dark-soft:#e8e9ea; --k-book:#c8202b; --k-print:#3b3d3f; --k-sub:#3b3d3f; --k-prev:#f5cdd0; --k-mock:#8c9196; --k-none:#dcdee0; /* 자료 종류가 더 필요할 때 쓸 예비색: 레드와 그레이 안에서 진하기만 다르게 */ --k-x1:#8f1a23; --k-x2:#6b6f73; --k-x3:#a9adb1;
  --good:#3b3d3f; --good-soft:#e8e9ea; --warn:#c8202b; --warn-soft:#fbe6e8;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131516; --surface:#1c1f21; --surface2:#25292b; --ink:#eceeef; --muted:#9aa1a6; --line:#33383b;
  --accent:#ef5a64; --accent-ink:#1a0a0c; --accent-soft:#3b1d21; --hot:#ef5a64; --hot-soft:#3b1d21;
  --dark:#aeb4b9; --dark-soft:#2c3033; --k-book:#c8202b; --k-print:#3b3d3f; --k-sub:#3b3d3f; --k-prev:#f5cdd0; --k-mock:#8c9196; --k-none:#dcdee0; --k-x1:#8f1a23; --k-x2:#6b6f73; --k-x3:#a9adb1;
  --good:#aeb4b9; --good-soft:#2c3033; --warn:#ef5a64; --warn-soft:#3b1d21; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131516; --surface:#1c1f21; --surface2:#25292b; --ink:#eceeef; --muted:#9aa1a6; --line:#33383b;
  --accent:#ef5a64; --accent-ink:#1a0a0c; --accent-soft:#3b1d21; --hot:#ef5a64; --hot-soft:#3b1d21;
  --dark:#aeb4b9; --dark-soft:#2c3033; --k-book:#c8202b; --k-print:#3b3d3f; --k-sub:#3b3d3f; --k-prev:#f5cdd0; --k-mock:#8c9196; --k-none:#dcdee0; --k-x1:#8f1a23; --k-x2:#6b6f73; --k-x3:#a9adb1;
  --good:#aeb4b9; --good-soft:#2c3033; --warn:#ef5a64; --warn-soft:#3b1d21; color-scheme:dark}
*{box-sizing:border-box}
a{color:var(--accent)}a.btn{color:inherit;text-decoration:none;display:inline-block}
input,select,textarea,input[type=checkbox]{accent-color:var(--accent)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;margin:0}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:20px} h3{font-size:16px} h4{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-radius:0}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tools{display:flex;gap:6px;flex-wrap:wrap}
main{padding-block:20px 60px;display:flex;flex-direction:column;gap:20px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--hot)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0;width:100%;color:var(--ink);font-size:13.5px}
textarea{resize:vertical;min-height:60px}
input[type=checkbox]{width:auto}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--surface2);font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{white-space:nowrap;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.qt input,.qt select{padding:4px 5px;font-size:12.5px}
.qt td:nth-child(1) input{width:52px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;background:var(--dark-soft);color:var(--dark);white-space:nowrap}
.pill.hot{background:var(--hot-soft);color:var(--hot)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.schools{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:16px;align-items:start}
@media(max-width:760px){.schools{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.item small{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b .u{font-family:var(--f-body);font-size:.58em;font-weight:500;margin-left:3px;letter-spacing:0}
.kpi span{font-size:12px;color:var(--muted)} .kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.sum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.sum li::marker{color:var(--accent)}
.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface2);min-width:120px}
.stack i{display:block;height:100%}
.stack .a{background:var(--dark)} .stack .b{background:var(--hot)}
.hb{display:flex;align-items:center;gap:8px;min-width:100px}
.hb .tr{flex:1;height:10px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:50px}
.hb .tr i{display:block;height:100%;background:var(--dark)} .hb .tr i.h{background:var(--hot)}
.cover{--p:#ffffff;--pk:#1f2123;--pm:#62686d;--pr:#c8202b;--pd:#3b3d3f;background:var(--p);color:var(--pk);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.cover .ct{padding:36px clamp(20px,5vw,56px) 28px;display:flex;flex-direction:column;gap:28px}
.cover .lg{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.cover .lg .mark{height:clamp(44px,8vw,64px);display:flex;max-width:100%}.cover .lg .mark img{height:100%;width:auto;max-width:100%;object-fit:contain}
.cover .lg b{font-size:15px;display:inline;font-weight:500}.cover .lg span{color:var(--pm);font-size:13px}
.cover h1{font-size:clamp(28px,6vw,46px);letter-spacing:-.02em;line-height:1.15;font-weight:700;text-wrap:balance}
.cover h1 em{font-style:normal;color:var(--pr)}
.cover .sch{font-size:clamp(18px,3.4vw,26px);font-weight:500}
.cover dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 24px;margin:0;border-top:2px solid var(--pd);padding-top:16px}
.cover dt{font-size:12px;color:var(--pm)}.cover dd{margin:0;font-weight:500;font-size:15px;overflow-wrap:anywhere}
.cover .ft{background:var(--pd);color:#fff;padding:12px clamp(20px,5vw,56px);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;position:relative}
.cover .ft::before{content:"";position:absolute;left:0;top:0;bottom:0;width:clamp(20px,5vw,56px);background:var(--pr)}
.cover .ft span:first-child{margin-left:clamp(20px,5vw,56px)}
.cover .ft span:first-child{padding-left:0}
.hb span{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.qcard{border:0;border-top:1px solid var(--line);border-radius:0;padding:18px 0 6px;display:flex;flex-direction:column;gap:10px;background:none}
.qcard header{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.qcard .no{font-family:var(--f-mono);font-weight:500;font-size:16px}
.qcard pre{margin:0;white-space:pre-wrap;font-family:var(--f-body);background:none;border:0;border-radius:0;padding:0;font-size:13.5px;line-height:1.7}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.row>label{flex:1;min-width:130px}
.ex{background:var(--warn-soft);color:var(--warn);font-size:11px;padding:0 6px;border-radius:4px;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.live{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;background:var(--surface2);padding:8px 12px;border-radius:6px}
.live b{font-family:var(--f-mono);font-weight:500}
.drop{border:2px dashed var(--line);border-radius:8px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
pre.log{background:var(--surface2);padding:10px;border-radius:6px;max-height:280px;overflow:auto;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;margin:0;overflow-wrap:anywhere}
.st{display:flex;gap:8px;flex-wrap:wrap}
.pflist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px}
.pf{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}.pf:last-child{border-bottom:0}
.pf .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.ftb td{vertical-align:middle}
.ftb td:nth-child(2) select{min-width:128px}
.ftb td:nth-child(3) select{min-width:170px}
.ftb td:nth-child(4) select{min-width:130px}
.ftb td:nth-child(4) .st select:first-child{min-width:84px}
.pt td:nth-child(2) select{min-width:128px}.pt td:nth-child(3) select{min-width:170px}.pt td:nth-child(5) select{min-width:130px}
.pt td,.pt th{vertical-align:middle}.pt .pn{min-width:200px;overflow-wrap:anywhere}.pt select,.pt input{min-width:80px;padding:4px 6px;font-size:12.5px}
.gt th{text-align:center;white-space:nowrap;line-height:1.3}.gt tbody th{text-align:left;font-weight:500;color:var(--ink);background:none;white-space:normal;min-width:110px}
.gt td{text-align:center;padding:4px}
.gcell{width:100%;min-width:74px;min-height:44px;border:1px dashed var(--line);border-radius:6px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--muted)}
.gcell:hover{border-color:var(--accent);color:var(--accent)}
.gcell.has{border-style:solid;background:var(--dark-soft);color:var(--ink)}
.gcell.has b{font-size:13px}.gcell small{font-size:11px;color:var(--muted)}
.gcell.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.compact{--vh:118px;gap:8px!important}
.compact .cover .ct{padding:18px 30px 12px;gap:12px}.compact .cover .lg .mark{height:44px}.compact .cover h1{font-size:30px}.compact .cover .sch{font-size:18px}.compact .cover dl{padding-top:10px;gap:8px 18px}.compact .cover .ft{padding:7px 30px}
.compact .kpis{gap:8px}.compact .kpi{padding:7px 12px}.compact .kpi b{font-size:20px}
.compact .panel{padding:10px 12px;gap:8px}.compact .panel h3{font-size:15px}
.compact .sum{gap:3px}.compact .tw td,.compact .tw th{padding:3px 8px}
.compact .cols{gap:8px}.compact .vwrap{padding:10px 10px 2px}.compact .vlgs{gap:3px}
.vwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 12px 6px}
.vplot{position:relative;min-width:max-content;padding-top:4px}
.vcols{position:relative;z-index:1;display:flex;gap:2px;align-items:flex-end}
.vc{display:flex;flex-direction:column;align-items:center;min-width:30px;flex:1}
.vb{height:calc(var(--vh,180px) + 16px);width:100%;padding-top:16px;box-sizing:border-box;display:flex;align-items:flex-end;justify-content:center}
.vb i{position:relative;display:block;width:68%;max-width:30px;border-radius:3px 3px 0 0;min-height:1px}
.vb i span{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:#62686d;white-space:nowrap}
.vn{height:22px;line-height:22px;font-family:var(--f-mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:#1f2123}
.vline{position:absolute;left:0;right:0;z-index:0;border-top:1px dashed #cfd2d5;pointer-events:none}
.vline em{position:absolute;right:0;top:-17px;font-style:normal;font-size:10.5px;color:#62686d;background:#fff;padding:0 4px}
.vlgs{display:flex;flex-direction:column;gap:6px}
.vlg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vlg i{width:12px;height:12px;border-radius:3px;flex:none;align-self:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.vlg .vnos{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.simtab{width:100%;border-collapse:collapse}
.simtab th,.simtab td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.simtab tr:last-child td{border-bottom:0}
.simtab th{background:none;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.nums{display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:500}
.nums span{cursor:default}
.nums.same{color:var(--hot)}.nums.mod{color:var(--warn)}.nums.orig{color:var(--good)}
.cnt{font-family:var(--f-mono);font-size:18px;font-weight:500;white-space:nowrap}
.kpi.cut b input{width:4.2em;border:0;border-bottom:1px dashed var(--line);border-radius:0;padding:0 2px;background:none;font:inherit;color:inherit;text-align:left}
.kpi.cut b input:focus{outline:none;border-bottom-color:var(--accent)}
.kpi.cut b input::-webkit-inner-spin-button{display:none}
.kpi.cut b .u{font-family:var(--f-body);font-size:.5em;margin-left:3px}
.kpi.cut .hb2{align-self:flex-start;margin-top:4px}
.seg{display:flex;height:34px;border-radius:6px;overflow:hidden;gap:2px}
.seg div{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:500;min-width:56px;white-space:nowrap}
.seg .same,.chip.same{background:var(--hot-soft);color:var(--hot)}
.seg .mod,.chip.mod{background:var(--warn-soft);color:var(--warn)}
.seg .orig,.chip.orig{background:var(--good-soft);color:var(--good)}
.simrow{display:flex;flex-direction:column;gap:8px;padding:12px 0 2px;border-top:1px solid var(--line)}
.simh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;font-variant-numeric:tabular-nums}
.tw td select,.tw td input[type=text]{min-width:84px}
.qbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:760px){.qbody{grid-template-columns:1fr}}
.vc[data-qid]{cursor:pointer}
.qimg{display:block;width:auto;max-width:100%;height:auto;background:#fff;border:0;border-radius:0}
.qpaste{border:1px dashed var(--line);border-radius:5px;padding:3px 8px;font-size:12px;cursor:text;color:var(--muted)}
.qpaste:focus{border-color:var(--accent);color:var(--ink)}
.cover .ph{width:72px;height:72px;border:2px dashed #b5b9bd;border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--pm);cursor:pointer;flex:none}
#brand-logo img{height:100%;width:auto;max-width:170px;object-fit:contain}
summary{cursor:pointer;font-weight:500}
@media print{
  :root:root:root{--bg:#fff;--surface:#fff;--surface2:#f6f6f7;--ink:#1f2123;--muted:#62686d;--line:#dcdee0;--accent:#c8202b;--accent-soft:#fbe6e8;--hot:#c8202b;--hot-soft:#fbe6e8;--dark:#3b3d3f;--dark-soft:#e8e9ea;color-scheme:light}
  header.top,.noprint,body::before,#toast{display:none!important}
  body{background:#fff}main{padding-block:0}
  .panel,.kpi,.qcard,.cover,.tw{break-inside:avoid}
  .cover{border:0}
  .kpi.cut b input{border:0!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header class="top"><div class="wrap bar">
  <div class="brand"><span id="brand-logo" style="display:inline-flex;height:24px;align-self:center"></span>청라 내신 분석실 <small>중·고등 시험지 분석</small></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="tools">
    <button class="btn sm" data-act="export-json" id="b-exp">백업 저장</button>
    <button class="btn sm" data-act="import-json" id="b-imp">백업 불러오기</button>
    <input type="file" id="file-in" accept=".json,application/json" hidden>
  </div>
</div></header>

<div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="shim.js"></script>
<script>
'use strict';
const GRADES=['중1','중2','중3','고1','고2','고3'];
const gradeOpts=(cur,blank)=>{const l=[...(blank?['']:[]),...GRADES];if(cur&&!l.includes(cur))l.push(cur);return l};
const AUTHORS=['FELIX','CELINA','DAVE','LUCAS','LIA'];
const SUBJECTS=['수학','공통수학1','공통수학2','대수','미적분Ⅰ','확률과 통계','기하','미적분Ⅱ','경제 수학','인공지능 수학','직업 수학','수학과 문화'];
const subjOpts=(cur,blank)=>{const l=[...(blank?['']:[]),...SUBJECTS];if(cur&&!l.includes(cur))l.push(cur);return l};
const LEVELS=['하','중','상','최상'], SOURCES=['교과서','학교프린트','전년도 기출','부교재','모의고사 기출','학원자료','신유형·창작'];
const TABS=[['status','현황판'],['upload','자료 업로드'],['exam','시험 입력'],['report','분석 리포트'],['compare','학교 비교']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pc=v=>v==null||v===''?'-':fmt(v)+'%';
const fmt=(n,d=0)=>n==null||isNaN(n)?'-':Number(n).toFixed(d).replace(/\.0+$/,'');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const isHigh=q=>q.diff==='상'||q.diff==='최상';

/* ---------- 예시 데이터 ---------- */
function rng(seed){let s=seed;return()=>{s=(s*9301+49297)%233280;return s/233280}}
function genExam(school,o){
  const r=rng(o.seed),qs=[],n=o.mc+o.sa;let no=1;
  for(let i=0;i<n;i++){
    const sa=i>=o.mc,pos=(sa?i-o.mc:i)/(sa?o.sa:o.mc);
    const unit=o.units[Math.min(o.units.length-1,Math.floor(i/n*o.units.length))];
    let diff=pos<.45?(r()<.6?'하':'중'):pos<.8?(r()<.6?'중':'상'):(r()<.55?'상':'최상');
    if(sa&&pos>.6)diff=r()<.5?'상':'최상';
    const src=SOURCES[Math.floor(r()*5.2)];
    const simS=src==='학교프린트'||src==='부교재'?Math.round(55+r()*40):Math.round(r()*35);
    const simA=src==='학원자료'?Math.round(60+r()*35):Math.round(r()*45);
    const cr=Math.round({하:92,중:78,상:52,최상:30}[diff]-r()*14);
    qs.push({id:uid(),no:no++,type:sa?'서답':'객관',unit,topic:'',score:sa?o.saScore:o.mcScore,diff,source:src,ref:'',simSchool:simS,simAcademy:simA,correctRate:cr,discrim:cr<=45,key:diff==='최상',solution:''});
  }
  const k=qs.filter(q=>q.key||q.discrim).slice(0,2);
  if(k[0]){k[0].topic='조건을 만족하는 값 추론';k[0].solution='① 주어진 조건을 식으로 정리한다.\n② 경우를 나누어 각각 대입한다.\n③ 모순되는 경우를 제외하고 답을 확정한다.\n(예시 풀이입니다. 실제 문항에 맞게 수정하세요.)'}
  return{id:uid(),example:true,schoolId:school,year:2026,grade:o.grade,semester:o.sem,term:o.term,subject:'수학',publisher:o.pub,range:o.range,minutes:o.min,note:'',questions:qs};
}
function seedData(){
  const A={id:'exA',example:true,name:'예시A중학교',level:'중',note:'예시 데이터입니다. 실제 학교를 추가하고 이 예시는 삭제하세요.',textbooks:[{id:uid(),grade:'중2',subject:'수학',publisher:'예시출판사 가',memo:''}],materials:[{id:uid(),kind:'학교프린트',title:'단원별 기본 학습지',scope:'중2 수학',memo:'수업 시간 배부, 시험 문항과 겹치는 비율 높음'},{id:uid(),kind:'부교재',title:'내신 대비 워크북',scope:'중2 수학',memo:''}]};
  const B={id:'exB',example:true,name:'예시B중학교',level:'중',note:'예시 데이터',textbooks:[{id:uid(),grade:'중2',subject:'수학',publisher:'예시출판사 나',memo:''}],materials:[{id:uid(),kind:'학교프린트',title:'서술형 대비 프린트',scope:'중2 수학',memo:''}]};
  const U=['유리수와 순환소수','식의 계산','일차부등식','연립일차방정식'];
  return{v:1,schools:[A,B],academy:[{id:uid(),kind:'학원 교재',title:'중2 1학기 내신 총정리',scope:'중2 수학',memo:'예시'}],
    exams:[genExam('exA',{seed:11,mc:16,sa:4,mcScore:3.5,saScore:11,units:U,grade:'중2',sem:1,term:'중간',pub:'예시출판사 가',range:'1~3단원',min:50}),
           genExam('exB',{seed:23,mc:15,sa:5,mcScore:4,saScore:8,units:U.slice(0,3),grade:'중2',sem:1,term:'중간',pub:'예시출판사 나',range:'1~3단원',min:50})]};
}

/* ---------- 상태·저장 ---------- */
let S=seedData(), ui={tab:'status',school:null,exam:null,rep:null,openQ:{},cmp:{},up:{kind:'시험지',schoolId:'',grade:'',subject:'수학',year:new Date().getFullYear(),semester:'1',term:'중간'},pending:[],log:[],api:null}, loaded=false, db=null, saveT=null;
const LS='cheongra-exam-v1';
try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);if(p&&p.schools)S=p}}catch(e){}
S.files=S.files||[];
/* 학교·자료 정보는 app/state, 시험은 exams/<id>, 파일 본문은 filetext/<id>_<n> 문서에 나눠 저장 */
let lastCore=null,lastEx={};
const coreOf=()=>{const {exams,...c}=S;return JSON.stringify(c)};
function save(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(!db||!loaded)return;
  clearTimeout(saveT);
  saveT=setTimeout(flush,500);
}
async function flush(){
  try{
    const c=coreOf();
    if(c!==lastCore){await db.doc('app/state').set({json:c,at:Date.now()});lastCore=c}
    const ids=new Set();
    for(const e of S.exams){ids.add(e.id);const j=JSON.stringify(e);if(lastEx[e.id]!==j){await db.doc('exams/'+e.id).set({json:j});lastEx[e.id]=j}}
    for(const id of Object.keys(lastEx))if(!ids.has(id)){await db.doc('exams/'+id).delete();delete lastEx[id]}
  }catch(e){toast('서버 저장에 실패했습니다. 이 브라우저에는 저장되어 있습니다.')}
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ---------- 경로 편집 ---------- */
function walk(parts){let o=S;for(const p of parts){o=Array.isArray(o)?o.find(x=>x.id===p):o?.[p];if(o==null)return null}return o}
const TPL={
  textbooks:()=>({id:uid(),grade:'',subject:'',publisher:'',memo:''}),
  materials:()=>({id:uid(),kind:'학교프린트',title:'',scope:'',memo:''}),
  academy:()=>({id:uid(),kind:'학원 교재',title:'',scope:'',memo:''}),
  questions:(arr)=>({id:uid(),no:(arr.reduce((m,q)=>Math.max(m,+q.no||0),0))+1,type:'객관',unit:'',topic:'',stem:'',score:null,diff:'중',source:'교과서',ref:'',simSchool:null,simAcademy:null,correctRate:null,discrim:false,key:false,solution:''})
};

/* ---------- 분석 ---------- */
function analyze(e){
  const qs=e.questions||[], mc=qs.filter(q=>q.type==='객관'), sa=qs.filter(q=>q.type==='서답');
  const sum=a=>a.reduce((t,q)=>t+(+q.score||0),0), total=sum(qs), hi=qs.filter(isHigh);
  const units={};
  qs.forEach(q=>{const u=q.unit||'(단원 미입력)';const x=units[u]||(units[u]={u,n:0,score:0,high:0,highScore:0,mc:0,sa:0});
    x.n++;x.score+=+q.score||0;q.type==='객관'?x.mc++:x.sa++;if(isHigh(q)){x.high++;x.highScore+=+q.score||0}});
  const ul=Object.values(units);
  const wavg=k=>{let w=0,s=0;qs.forEach(q=>{if(q[k]!=null&&q[k]!==''){w+=+q.score||0;s+=(+q.score||0)*q[k]}});return w?s/w:null};
  const diff={},src={};LEVELS.forEach(l=>diff[l]={n:0,s:0});SOURCES.forEach(l=>src[l]={n:0,s:0});
  qs.forEach(q=>{(diff[q.diff]||(diff[q.diff]={n:0,s:0})).n++;diff[q.diff].s+=+q.score||0;const sk=srcOf(q,e.schoolId);(src[sk]||(src[sk]={n:0,s:0})).n++;src[sk].s+=+q.score||0});
  const simS=qs.filter(q=>q.simSchool!=null), simA=qs.filter(q=>q.simAcademy!=null);
  const T0=thr(),band=(a,k)=>({same:a.filter(q=>q[k]>=T0.t1).length,mod:a.filter(q=>q[k]>=T0.t2&&q[k]<T0.t1).length,orig:a.filter(q=>q[k]<T0.t2).length,n:a.length});
  const disc=qs.filter(q=>q.discrim||(q.correctRate!=null&&q.correctRate<=40)).sort((a,b)=>(a.correctRate??50)-(b.correctRate??50));
  const keyQ=qs.filter(q=>q.key||(q.diff==='최상'&&!q.keyOff)||q.discrim).sort((a,b)=>a.no-b.no);
  return{qs,mc,sa,total,n:qs.length,hi,hiRatio:pct(hi.length,qs.length),saScoreRatio:pct(sum(sa),total),units:ul,
    diff,src,simS:wavg('simSchool'),simA:wavg('simAcademy'),bandS:band(simS,'simSchool'),bandA:band(simA,'simAcademy'),disc,keyQ};
}
const schoolOf=id=>S.schools.find(s=>s.id===id);
/* 교과서 출판사는 학교 자료의 교과서 표(학년·과목별)가 유일한 원본입니다. 시험에서는 그 값을 읽고, 시험에서 고치면 같은 표를 고칩니다. */
const bookRow=e=>{const s=schoolOf(e.schoolId);return s?s.textbooks.find(x=>x.grade===e.grade&&x.subject===e.subject):null};
/* 출처는 참고자료(ref)로 찾은 실제 파일의 종류를 따릅니다. 같은 자료가 어떤 문항에서는 교과서, 어떤 문항에서는 학교 프린트로 갈리지 않게 합니다 */
const KIND2SRC={'교과서':'교과서','학교 프린트':'학교프린트','부교재':'부교재','전년도 기출':'전년도 기출','모의고사 기출':'모의고사 기출','학원 자료':'학원자료'};
function srcOf(q,schoolId){
  if(q.ref){const fs=S.files.filter(f=>f.name===q.ref&&f.kind!=='시험지'),f=fs.find(x=>x.schoolId===schoolId)||fs.find(x=>!x.schoolId)||fs[0];if(f&&KIND2SRC[f.kind])return KIND2SRC[f.kind]}
  return q.source;
}
const pubOf=e=>bookRow(e)?.publisher||e.publisher||'';
function setPub(e,v){
  const s=schoolOf(e.schoolId);if(!s){toast('먼저 학교를 선택하세요.');return}
  const r=bookRow(e);
  if(r)r.publisher=v;else s.textbooks.push({id:uid(),grade:e.grade,subject:e.subject,publisher:v,memo:''});
  e.publisher='';save();
}
const examLabel=e=>`${schoolOf(e.schoolId)?.name||'(학교 삭제됨)'} · ${e.year} ${e.grade} ${e.subject} ${e.semester}학기 ${e.term}`;
function peersOf(e){return S.exams.filter(x=>x.id!==e.id&&x.grade===e.grade&&x.subject===e.subject&&x.semester===e.semester&&x.term===e.term&&x.schoolId!==e.schoolId)}
function summaryLines(e,a){
  const L=[],pe=peersOf(e).map(x=>({e:x,a:analyze(x)}));
  L.push(`객관식 ${a.mc.length}문항, 서답형 ${a.sa.length}문항(총 ${a.n}문항, ${fmt(a.total,1)}점)이며 서답형이 배점의 ${a.saScoreRatio}%를 차지합니다.`);
  if(pe.length){
    const s=pe.reduce((t,p)=>t+p.a.sa.length,0)/pe.length,r=pe.reduce((t,p)=>t+p.a.saScoreRatio,0)/pe.length;
    const d=a.saScoreRatio-r,ds=a.sa.length-s;
    const lv=d>=5?'많은':d<=-5?'적은':ds>=2?'많은':ds<=-2?'적은':'평이한';
    L.push(lv==='많은'?'서답형 문항은 타 학교보다 많은 편입니다.':lv==='적은'?'서답형 문항은 타 학교보다 적은 편입니다.':'서답형 문항은 타 학교와 비슷한 평이한 수준입니다.');
  }else L.push('비교할 타 학교 시험이 없어 서답형 비교는 넣지 못했습니다.');
  if(a.units.length){
    const byCount=[...a.units].sort((x,y)=>y.n-x.n)[0], byHigh=[...a.units].filter(u=>u.high>0).sort((x,y)=>y.highScore-x.highScore)[0];
    L.push(`출제 문항이 가장 많은 단원은 「${byCount.u}」(${byCount.n}문항, ${fmt(byCount.score,1)}점)입니다.`);
    if(byHigh)L.push(`고난도(상·최상) 비중이 가장 큰 단원은 「${byHigh.u}」로 고난도 ${byHigh.high}문항, ${fmt(byHigh.highScore,1)}점입니다. 전체 고난도 문항은 ${a.hi.length}개(${a.hiRatio}%)입니다.`);
  }
  if(a.simS!=null)L.push(`학교 부자료와의 유사도는 ${fmt(a.simS)}%이며, ${thr().t1}% 이상인 문항이 ${a.bandS.same}개, ${thr().t2}~${thr().t1-1}%가 ${a.bandS.mod}개입니다.`);
  if(a.disc.length)L.push(`변별력이 높은 문항은 ${a.disc.slice(0,5).map(q=>q.no+'번'+(q.correctRate!=null?`(정답률 ${q.correctRate}%)`:'')).join(', ')}입니다.`);
  return L;
}

/* ---------- 화면 조각 ---------- */
const attr=(p,extra='')=>`data-p="${esc(p)}" id="f-${esc(p.replace(/[^\w]/g,'-'))}" ${extra}`;
const val=(p)=>{const parts=p.split('/'),o=walk(parts.slice(0,-1));return o?o[parts.at(-1)]:''};
const inp=(p,o={})=>`<input ${attr(p)} ${o.num?'type="number" step="any" data-n="1"':'type="text"'} value="${esc(val(p))}" ${o.list?`list="${o.list}"`:''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.aria?`aria-label="${esc(o.aria)}"`:''}>`;
const sel=(p,opts,o={})=>`<select ${attr(p)} ${o.aria?`aria-label="${esc(o.aria)}"`:''}>${opts.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return`<option value="${esc(v)}"${String(v)===String(val(p))?' selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const chk=(p,l)=>`<input type="checkbox" ${attr(p)} ${val(p)?'checked':''} aria-label="${esc(l)}">`;
const ta=(p,r=3,ph='')=>`<textarea ${attr(p)} rows="${r}" placeholder="${esc(ph)}">${esc(val(p))}</textarea>`;
const field=(label,html)=>`<label class="f">${esc(label)}${html}</label>`;
const bar=(v,max,hot)=>`<div class="hb"><div class="tr"><i class="${hot?'h':''}" style="width:${max?Math.min(100,v/max*100):0}%"></i></div></div>`;
const uniq=a=>[...new Set(a.filter(Boolean))];

function datalists(){
  const units=uniq(S.exams.flatMap(e=>e.questions.map(q=>q.unit)));
  const refs=uniq([...S.schools.flatMap(s=>s.materials.map(m=>m.title)),...S.academy.map(m=>m.title)]);
  return`<datalist id="dl-units">${units.map(u=>`<option value="${esc(u)}">`).join('')}</datalist><datalist id="dl-refs">${refs.map(u=>`<option value="${esc(u)}">`).join('')}</datalist>
  <datalist id="dl-subj"><option value="수학"><option value="공통수학1"><option value="공통수학2"><option value="대수"><option value="미적분Ⅰ"><option value="확률과 통계"><option value="기하"><option value="미적분Ⅱ"><option value="경제 수학"><option value="인공지능 수학"><option value="직업 수학"><option value="수학과 문화"></datalist>`;
}

/* ---------- 탭: 시험 입력 ---------- */
function liveHtml(e){const a=analyze(e);return`<span>객관식 <b>${a.mc.length}</b>문항</span><span>서답형 <b>${a.sa.length}</b>문항</span><span>총 <b>${a.n}</b>문항</span><span>합계 <b>${fmt(a.total,1)}</b>점</span><span>고난도 <b>${a.hi.length}</b>문항</span>`}
function viewExam(){
  if(!S.exams.find(e=>e.id===ui.exam))ui.exam=S.exams[0]?.id||null;
  const e=S.exams.find(x=>x.id===ui.exam);
  const bar=`<section class="panel"><header><h3>시험 선택</h3><div class="tools"><button class="btn sm pri" data-act="add-exam">+ 새 시험</button>${e?'<button class="btn sm" data-act="dup-exam">복제</button><button class="btn sm danger" data-act="del-exam">삭제</button>':''}</div></header>
  <select id="exam-pick" data-act-change="pick-exam" aria-label="시험 선택">${S.exams.map(x=>`<option value="${x.id}"${x.id===ui.exam?' selected':''}>${esc(examLabel(x))}${x.example?' (예시)':''}</option>`).join('')||'<option>시험 없음</option>'}</select></section>`;
  if(!e)return datalists()+bar+'<div class="empty">시험을 추가하면 문항별 입력표가 나타납니다. 먼저 [자료 업로드] 탭에서 학교를 등록하세요.</div>';
  const b=`exams/${e.id}`;
  const head=`<section class="panel"><header><h3>시험 정보</h3></header><div class="grid">
  ${field('학교',sel(`${b}/schoolId`,S.schools.map(s=>[s.id,s.name||'(이름 없음)'])))}${field('연도',inp(`${b}/year`,{num:1}))}${field('학년',sel(`${b}/grade`,gradeOpts(e.grade)))}
  ${field('학기',sel(`${b}/semester`,[[1,'1학기'],[2,'2학기']]))}${field('시험',sel(`${b}/term`,['중간','기말']))}${field('과목',sel(`${b}/subject`,subjOpts(e.subject)))}
  ${field('교과서 출판사 (학교 자료와 연동)',`<input type="text" id="f-pub" data-pub="${e.id}" value="${esc(pubOf(e))}" placeholder="학교·학년·과목 기준">`)}${field('시험 범위',inp(`${b}/range`,{ph:'1~3단원'}))}${field('시험 시간(분)',inp(`${b}/minutes`,{num:1}))}</div>

    ${ui.editSol===q.id?`<div class="sol-ed"><b class="shl">문항 정보</b><div class="grid">${field('단원',inp(`exams/${e.id}/questions/${q.id}/unit`,{list:'dl-units'}))}${field('출제 포인트',inp(`exams/${e.id}/questions/${q.id}/topic`))}${field('난이도',sel(`exams/${e.id}/questions/${q.id}/diff`,LEVELS))}${field('배점',inp(`exams/${e.id}/questions/${q.id}/score`,{num:1}))}${field('정답률(%)',inp(`exams/${e.id}/questions/${q.id}/correctRate`,{num:1}))}${field('출처',sel(`exams/${e.id}/questions/${q.id}/source`,SOURCES))}${field('참고자료',inp(`exams/${e.id}/questions/${q.id}/ref`,{list:'dl-refs'}))}</div><b class="shl">문항 분석</b><textarea id="anbox" rows="6" placeholder="왜 변별력 있는 문항으로 골랐는지, 학교 프린트와 얼마나 비슷했는지, 이 문제가 갖는 의미 등">${esc(q.analysis||'')}</textarea><b class="shl">풀이 (학원 풀이와 정석 풀이 비교, 수업에서 한 간략한 풀이 등)</b><div class="solimgs">${(q.solImgs||[]).map(sid=>`<div class="solimg"><img data-qimg="${sid}" data-solimg="1" alt="풀이 이미지"><button class="btn sm danger noprint" data-act="sol-img-del" data-id="${q.id}" data-path="${sid}">이미지 삭제</button></div>`).join('')}</div><div class="st noprint"><label class="btn sm pri">손글씨 풀이 이미지 올리기<input type="file" accept="image/*" multiple hidden data-solfile="${q.id}"></label><span class="hint pastebox" tabindex="0" data-pastesol="${q.id}">여기를 클릭한 뒤 Ctrl+V로 캡처 이미지를 붙여넣을 수도 있습니다</span></div><textarea id="solbox" rows="4" placeholder="글로 적을 풀이가 있으면 적으세요(선택). 수식은 $ 사이에 LaTeX로 적습니다.">${esc(solClean(q.solution))}</textarea><div class="st noprint"><button class="btn sm pri" data-act="sol-save" data-id="${q.id}">저장</button><button class="btn sm" data-act="sol-cancel">닫기</button><span class="hint">이미지는 올리는 즉시 저장됩니다. 글은 [저장]을 눌러야 저장됩니다.</span></div></div>`:`${q.analysis?`<div class="shl">문항 분석</div><pre>${solHtml(q.analysis)}</pre>`:''}${(q.solImgs&&q.solImgs.length)||q.solution?`<div class="shl">풀이</div>${(q.solImgs||[]).map(sid=>`<div class="solimg"><img data-qimg="${sid}" data-solimg="1" alt="풀이 이미지"></div>`).join('')}${q.solution?`<pre>${solHtml(q.solution)}</pre>`:''}`:''}${!q.analysis&&!q.solution&&!(q.solImgs&&q.solImgs.length)?'<div class="hint">문항 분석과 풀이가 아직 없습니다. 아래 [풀이·분석 수정]에서 직접 적고 손글씨 풀이 이미지를 올리세요.</div>':''}<div class="st noprint"><button class="btn sm" data-act="sol-edit" data-id="${q.id}">풀이·분석 수정</button></div>`}</div></div></article>`).join('');
  const kP=`<section class="panel"><header><h3>주요문항 설명 및 풀이</h3>${hbtn('key')}</header>${kq||'<div class="empty">주요·변별 표시를 한 문항이나 난이도 최상 문항이 여기에 나타납니다.</div>'}</section>`;
  const cq=[...a.qs].filter(q=>q.cmp&&q.simBest!=null&&(q.refImg||IMGS['ref_'+q.id])).sort((x,y)=>x.no-y.no);
  const cmpCards=cq.map(q=>{const v=q.simBest;return`<article class="qcard pair"><header><span class="no">${q.no}번</span><span class="pill hot">${v>=T.t1?'거의 동일':v>=T.t2?'변형':'유사'} ${v}%</span><span class="hint">${esc(q.ref||'')}${q.refPageShown?' · '+q.refPageShown+'쪽':''}</span><button class="btn sm noprint" data-act="cmp-remove" data-id="${q.id}">빼기</button></header><div class="qbody"><div><div class="hint" style="margin-bottom:6px">실제 시험</div>${qvisual(q)}</div><div><div class="hint" style="margin-bottom:6px">자료 문제</div><img class="qimg" data-qimg="ref_${q.id}" alt="${q.no}번과 비슷한 자료 문제"></div></div></article>`}).join('');
  const cmpP=cmpCards?`<section class="panel"><header><h3>자료와 문항 비교</h3>${hbtn('cmp')}</header>${cmpCards}</section>`:`<section class="panel noprint"><header><h3>자료와 문항 비교</h3>${hbtn('cmp')}</header><div class="empty">비교란이 비어 있습니다. 위 [자료 유사도] 그래프에서 막대를 눌러, 비교란에 넣을 문제를 고르세요.</div></section>`;
  return datalists()+pick+coverSettings(e)+'<div id="blogbox"></div><div id="report-body" style="display:flex;flex-direction:column;gap:20px">'+coverHtml(e)+secBar+(sh('kpi')?'':kpis+cutBar)+(sh('sum')?'':sumP)+(sh('unit')?'':unitP)+dP+(sh('sim')?'':simP)+(sh('cmp')?'':cmpP)+(sh('key')?'':kP)+'</div>';
}
function cmpBars(items,hl){
  const max=Math.max(...items.map(i=>i.a.n),1);
  return`<div style="display:flex;flex-direction:column;gap:8px"><div class="legend"><span><b style="background:var(--dark)"></b>객관식</span><span><b style="background:var(--hot)"></b>서답형</span></div>`+items.map(i=>`<div style="display:grid;grid-template-columns:minmax(110px,200px) 1fr;gap:10px;align-items:center"><span style="${i.e.id===hl?'font-weight:700':''};min-width:0;overflow-wrap:anywhere">${esc(schoolOf(i.e.schoolId)?.name||'?')}${i.e.id===hl?' (이 시험)':''}</span>
  <div style="display:flex;align-items:center;gap:8px"><div class="stack" style="width:${i.a.n/max*100}%"><i class="a" style="width:${pct(i.a.mc.length,i.a.n)}%"></i><i class="b" style="width:${pct(i.a.sa.length,i.a.n)}%"></i></div><span style="font-family:var(--f-mono);font-size:12px;white-space:nowrap">${i.a.mc.length} + ${i.a.sa.length}</span></div></div>`).join('')+'</div>';
}

/* ---------- 탭: 학교 비교 ---------- */
function viewCompare(){
  const ex=S.exams,c=ui.cmp;
  const opts=k=>uniq(ex.map(e=>e[k]));
  if(!c.init&&ex.length){const e=ex[0];Object.assign(c,{grade:e.grade,subject:e.subject,semester:String(e.semester),term:e.term,init:1})}
  const f=(k,lbl,vs)=>field(lbl,`<select data-c="${k}" id="c-${k}" aria-label="${lbl}"><option value="">전체</option>${vs.map(v=>`<option value="${esc(v)}"${String(c[k])===String(v)?' selected':''}>${esc(v)}</option>`).join('')}</select>`);
  const rows=ex.filter(e=>(!c.grade||e.grade===c.grade)&&(!c.subject||e.subject===c.subject)&&(!c.semester||String(e.semester)===c.semester)&&(!c.term||e.term===c.term)).map(e=>({e,a:analyze(e)}));
  const tb=rows.map(({e,a})=>{const top=[...a.units].sort((x,y)=>y.highScore-x.highScore)[0];return`<tr><td>${esc(schoolOf(e.schoolId)?.name||'?')}</td><td class="num">${e.year}</td><td class="num">${a.mc.length}</td><td class="num">${a.sa.length}</td><td class="num">${a.saScoreRatio}%</td><td class="num">${a.hiRatio}%</td><td class="num">${a.simS!=null?fmt(a.simS)+'%':'-'}</td><td>${top&&top.high?esc(top.u):'-'}</td><td><button class="btn sm" data-act="open-report" data-id="${e.id}">리포트</button></td></tr>`}).join('');
  const avg=k=>rows.length?rows.reduce((t,r)=>t+k(r.a),0)/rows.length:0;
  return`<section class="panel"><header><h3>비교 조건</h3></header><div class="grid">${f('grade','학년',opts('grade'))}${f('subject','과목',opts('subject'))}${f('semester','학기',opts('semester'))}${f('term','시험',opts('term'))}</div></section>
  ${rows.length?`<section class="panel"><header><h3>문항 구성 비교</h3></header>${cmpBars(rows,null)}</section>
  <section class="panel"><header><h3>학교별 지표</h3><span class="hint">${rows.length}건 · 평균 객관식 ${fmt(avg(a=>a.mc.length),1)} / 서답형 ${fmt(avg(a=>a.sa.length),1)} / 고난도 ${fmt(avg(a=>a.hiRatio),1)}%</span></header>
  <div class="tw"><table><thead><tr><th>학교</th><th class="num">연도</th><th class="num">객관식</th><th class="num">서답형</th><th class="num">서답 배점</th><th class="num">고난도</th><th class="num">학교유사</th><th>고난도 집중 단원</th><th></th></tr></thead><tbody>${tb}</tbody></table></div></section>`:'<div class="empty">조건에 맞는 시험이 없습니다. 조건을 넓히거나 시험을 입력하세요.</div>'}`;
}

const thr=()=>{const c=(S.cover||{});let a=Number(c.thr1),b=Number(c.thr2);if(!(a>0&&a<=100))a=60;if(!(b>0&&b<=100))b=30;if(b>=a)b=Math.max(1,a-10);return{t1:a,t2:b}};
const logoHtml=()=>S.cover.logo?`<img alt="학원 로고" src="${esc(S.cover.logo)}">`:'';
/* 예시로 만든 학교를 실제 학교 이름으로 바꿔 쓰는 경우, 더 이상 예시로 취급하지 않습니다 (예시 삭제 때 지워지지 않게) */
function unflagExamples(){
  let ch=false;
  (S.schools||[]).forEach(s=>{if(s.example&&!/^예시/.test(s.name||'')){s.example=false;if(/^예시 데이터/.test(s.note||''))s.note='';ch=true}});
  const real=new Set((S.schools||[]).filter(s=>!s.example).map(s=>s.id));
  (S.exams||[]).forEach(e=>{if(e.example&&real.has(e.schoolId)){e.example=false;ch=true}});
  if(ch)save();
}
function ensure(){unflagExamples();S.files=S.files||[];S.files.forEach(f=>{if(!f.schoolId&&!f.level)f.level=f.grade?f.grade[0]:'고'});S.cover=Object.assign({academy:'캐슬수학',sub:'청라 지역 중·고등 내신 분석',author:'',logo:'',hide:[],thr1:60,thr2:30},S.cover)}

  return`<section class="cover" aria-label="분석지 표지"><div class="ct"><div class="lg">${c.logo?`<span class="mark">${logoHtml()}</span>`:'<label class="ph" for="cover-logo">학원 로고 올리기</label>'}<div><b>${esc(c.academy)}</b> <span>${esc(c.sub)}</span></div></div>

  <dl><div><dt>학년·과목</dt><dd>${esc(e.grade)} ${esc(e.subject)}</dd></div><div><dt>교과서</dt><dd>${esc(tb)}</dd></div><div><dt>시험 범위</dt><dd>${esc(e.range||'-')}</dd></div><div><dt>문항 구성</dt><dd>객관식 ${a.mc.length} · 서답형 ${a.sa.length}</dd></div><div><dt>총 배점</dt><dd>${fmt(a.total,1)}점</dd></div></dl></div>

}

function logoFromSrc(src,cb,fail){
  {const im=new Image();im.onload=()=>{
    const k=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);
    /* 흰 배경이면 투명으로 바꾸고, 로고 둘레의 빈 여백을 잘라냅니다. 로고 그림 자체는 그대로 둡니다. */
    const d=g.getImageData(0,0,c.width,c.height),px=d.data,W=c.width,H=c.height;
    const white=(i)=>px[i+3]>240&&px[i]>235&&px[i+1]>235&&px[i+2]>235;
    if(white(0)&&white((W-1)*4)){for(let i=0;i<px.length;i+=4){const m=Math.min(px[i],px[i+1],px[i+2]);px[i+3]=Math.round(px[i+3]*Math.max(0,Math.min(1,(255-m)/150)))}g.putImageData(d,0,0)}
    let x0=W,y0=H,x1=0,y1=0;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(px[(y*W+x)*4+3]>24){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
    let o=c;
    if(x1>x0&&y1>y0){const p=Math.round(Math.max(x1-x0,y1-y0)*0.03);x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(W-1,x1+p);y1=Math.min(H-1,y1+p);
      o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height)}
    const u=o.toDataURL('image/png');
    cb(u)};
    im.onerror=()=>fail&&fail();im.src=src}
}
function setLogo(file){
  const r=new FileReader();
  r.onload=()=>logoFromSrc(r.result,u=>{if(u.length>700000){toast('로고 파일이 너무 큽니다. 더 작은 이미지를 올려 주세요.');return}S.cover.logo=u;save();refreshCover();toast('로고를 바꿨습니다.')},()=>toast('이미지를 읽을 수 없습니다.'));
  r.readAsDataURL(file);
}
function applyDefaultLogo(){logoFromSrc(DEFAULT_LOGO,u=>{S.cover.logo=u;save();if(document.querySelector('.cover'))refreshCover();else document.getElementById('brand-logo').innerHTML=logoHtml()})}
function render(){
  ensure();document.getElementById('brand-logo').innerHTML=logoHtml();
  document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-act="tab" data-id="${k}" aria-selected="${ui.tab===k}">${l}</button>`).join('');
  document.getElementById('main').innerHTML=({upload:viewUpload,status:viewStatus,exam:viewExam,report:viewReport,compare:viewCompare})[ui.tab]();
  hydrateImgs();
}

  if(act==='tab'){ui.tab=id;render();scrollTo(0,0)}
  else if(act==='pick-school'){ui.school=id;render()}
  else if(act==='add-school'){const s={id:uid(),name:'',level:'중',note:'',textbooks:[],materials:[]};S.schools.push(s);ui.school=s.id;save();render()}
  else if(act==='hide-item'){S.cover.hide=[...new Set([...(S.cover.hide||[]),id])];save();render()}
  else if(act==='show-item'){S.cover.hide=(S.cover.hide||[]).filter(x=>x!==id);save();render()}
  else if(act==='q-flag'){const q=solQ(id);if(q){const k=path;if(k==='key'){q.key=!q.key;q.keyOff=q.key?false:(q.diff==='최상'&&!q.discrim)}else if(k==='discrim'){q.discrim=!q.discrim}if(ui.editSol===id)grabSol(q);save();render();if(popQ===id)showPop(id,true)}}
  else if(act==='sol-edit'){ui.editSol=id;render()}
  else if(act==='sol-cancel'){ui.editSol=null;render()}
  else if(act==='sol-save'){const q=solQ(id);if(q){grabSol(q);q.solution=(q.solution||'').trim();q.analysis=(q.analysis||'').trim();ui.editSol=null;save();render()}}
  else if(act==='sol-img-del'){const q=solQ(id);if(q){grabSol(q);q.solImgs=(q.solImgs||[]).filter(x=>x!==path);delete IMGS[path];if(db)try{db.doc('qimg/'+path).delete()}catch(x){}save();render()}}
  else if(act==='open-pair')showPop(id,true);
  else if(act==='cmp-close')hidePop();
  else if(act==='cmp-toggle')togglePair(id);
  else if(act==='cmp-find')findPair(id,b);
  else if(act==='cmp-remove'){const f=popFind(id);if(f){f.q.cmp=false;save();render()}}
  else if(act==='crop-refs')job(async()=>{const e=S.exams.find(x=>x.id===ui.exam);if(e)await cropRefs(e)});
  else if(act==='blog-img')blogImgCopy(Number(id));
  else if(act==='blog-zip')blogZip();
  else if(act==='blog-close'){const bx=document.getElementById('blogbox');if(bx)bx.innerHTML=''}
  else if(act==='save-pdf')savePdf();
  else if(act==='blog-copy')blogCopy();
  else if(act==='rescore-exam')job(async()=>{const e=S.exams.find(x=>x.id===ui.exam);if(e)await rescoreExam(e)});
  else if(act==='crop-exam')job(async()=>{const e=S.exams.find(x=>x.id===ui.exam);if(!e)return;if(!ui.api.images)throw new Error('이 화면에서는 이미지를 보낼 수 없습니다.');await cropQuestions(e,await getExamPages(S.files.find(f=>f.id===e.fileId)))});
  else if(act==='del-qimg'){const e=S.exams.find(x=>x.questions.some(q=>q.id===id)),q=e&&e.questions.find(x=>x.id===id);if(q){q.hasImg=false;delete IMGS[id];if(db)db.doc('qimg/'+id).delete().catch(()=>{});save();render()}}
  else if(act==='reset-logo')applyDefaultLogo();
  else if(act==='pick-files')document.getElementById('up-files').click();
  else if(act==='ctx'){ui.tab='upload';ui.school=id;ui.up.grade=b.dataset.g;ui.up.subject=b.dataset.s;render();document.getElementById('drop')?.scrollIntoView({block:'center'});toast(`${b.dataset.g} ${b.dataset.s}: 파일을 올리면 이 학년·과목이 기본값으로 들어갑니다.`)}
  else if(act==='clear-pending'){ui.pending=[];render()}
  else if(act==='run-upload')runUpload();
  else if(act==='stop-job'){ctl?.abort();UQ.length=0;log('중단을 요청했습니다. 대기 중인 파일도 취소합니다.')}
  else if(act==='rm-pending'){ui.pending.splice(Number(id),1);render()}
  else if(act==='match-exam')job(async()=>{const e=S.exams.find(x=>x.id===ui.exam);if(e)await matchExam(e)});
  else if(act==='draft-sol')job(async()=>{const e=S.exams.find(x=>x.id===ui.exam);if(e)await draftSolutions(e)});
  else if(act==='open-exam'){ui.exam=id;ui.tab='exam';render();scrollTo(0,0)}
  else if(act==='del-school'||act==='del-exam'||act==='del'||act==='clear-examples'||act==='del-file'||act==='reanalyze-exam'){
    const key=act+(path||id||'');
    if(armed.k!==key){armed.k=key;const old=b.textContent;b.textContent='한 번 더 눌러 삭제';setTimeout(()=>{if(armed.k===key){armed.k=null;if(b.isConnected)b.textContent=old}},3000);return}
    armed.k=null;
    if(act==='del-school'){S.exams=S.exams.filter(e=>e.schoolId!==id);S.schools=S.schools.filter(s=>s.id!==id);ui.school=null}
    else if(act==='del-exam'){S.exams=S.exams.filter(e=>e.id!==ui.exam);ui.exam=null}
    else if(act==='del-file'){deleteFile(id);return}
    else if(act==='reanalyze-exam'){reanalyze();return}
    else if(act==='clear-examples'){S.exams=S.exams.filter(e=>!e.example);S.schools=S.schools.filter(s=>!s.example);S.academy=S.academy.filter(m=>m.memo!=='예시');ui.school=null;ui.exam=null;ui.rep=null}
    else{const parts=path.split('/'),rid=parts.pop(),arr=walk(parts);if(Array.isArray(arr)){const i=arr.findIndex(x=>x.id===rid);if(i>=0)arr.splice(i,1)}}
    save();render();
  }
  else if(act==='add'){const parts=path.split('/'),arr=walk(parts);if(Array.isArray(arr)){arr.push(TPL[parts.at(-1)](arr));save();render()}}
  else if(act==='add-exam'){
    const s=ui.school&&schoolOf(ui.school)||S.schools[0];if(!s){toast('먼저 학교를 등록하세요.');return}
    const e={id:uid(),schoolId:s.id,year:new Date().getFullYear(),grade:s.level==='고'?'고1':'중2',semester:1,term:'중간',subject:'수학',publisher:'',range:'',minutes:50,note:'',questions:[]};
    S.exams.push(e);ui.exam=e.id;save();render()}
  else if(act==='dup-exam'){const e=S.exams.find(x=>x.id===ui.exam);if(!e)return;const c=JSON.parse(JSON.stringify(e));c.id=uid();c.example=false;c.questions.forEach(q=>q.id=uid());c.note=(c.note?c.note+'\n':'')+'(복제본)';S.exams.push(c);ui.exam=c.id;save();render()}
  else if(act==='toggle-q'){ui.openQ[id]=!ui.openQ[id];render()}
  else if(act==='paste-import')pasteImport();
  else if(act==='open-report'){ui.rep=id;ui.tab='report';render();scrollTo(0,0)}
  else if(act==='copy-report')copyReport();
  else if(act==='export-json')download('청라내신분석_백업_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1));
  else if(act==='export-csv')exportCsv();
  else if(act==='import-json')document.getElementById('file-in').click();
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='file-in'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p.schools||!p.exams)throw 0;p.files=p.files||[];S=p;ui.school=ui.exam=ui.rep=null;save();render();toast('백업을 불러왔습니다.')}catch(e){toast('올바른 백업 파일이 아닙니다.')}};r.readAsText(f);t.value='';return}
  if(t.dataset.qi){if(t.files[0])setQImage(t.dataset.qi,t.files[0]);t.value='';return}
  if(t.id==='cover-logo'){if(t.files[0])setLogo(t.files[0]);t.value='';return}
  if(t.id==='up-files'){addPending([...t.files]);t.value='';return}
  if(t.dataset.pm){const [i,k]=t.dataset.pm.split(':'),it=ui.pending[Number(i)];if(it){it.meta[k]=t.type==='checkbox'?t.checked:t.value;if(k==='kind'){it.meta.visual=VISUAL_KINDS.includes(t.value);if(t.value==='전년도 기출'&&!it.meta.detected.includes('year'))it.meta.year='';if(t.value==='시험지'&&!it.meta.year)it.meta.year=String(ui.up.year)}if(k==='kind'||k==='schoolId')render()}return}
  if(t.dataset.pub){const e=S.exams.find(x=>x.id===t.dataset.pub);if(e){setPub(e,t.value.trim());if(ui.tab==='report'){ui.coverOpen=true;refreshCover()}}return}
  if(t.dataset.u){ui.up[t.dataset.u]=t.value;if(t.dataset.u==='kind')render();return}
  if(t.dataset.actChange==='pick-school'){ui.school=t.value;render();return}
  if(t.dataset.actChange==='pick-exam'){ui.exam=t.value;render();return}
  if(t.dataset.actChange==='pick-rep'){ui.rep=t.value;render();return}
  if(t.dataset.c){ui.cmp[t.dataset.c]=t.value;render();return}
  if(t.dataset.p){
    const parts=t.dataset.p.split('/'),last=parts.pop(),o=walk(parts);if(!o)return;
    let v=t.type==='checkbox'?t.checked:t.value;
    if(t.dataset.n)v=v===''?null:Number(v);
    if(t.dataset.pct&&v!=null)v=Math.min(4,Math.max(0.2,v/100));
    else if(t.tagName==='SELECT'&&/^(semester)$/.test(last))v=Number(v);
    if(parts[0]==='files'&&last==='kind'){
      if(v==='시험지'&&!o.examId){toast('시험지로 바꾸려면 시험 정보가 필요합니다. 학교·학기를 고르고 시험지로 다시 올려 주세요.');t.value=o.kind;return}
      toast('종류를 바꿨습니다. 시험의 출처·유사도에 반영하려면 [시험 입력]에서 다시 분석하세요.');
    }
    o[last]=v;save();
    if(last==='imgScale'){render();return}
    if(parts[0]==='cover'){ui.coverOpen=true;if(last==='thr1'||last==='thr2'){render();return}refreshCover()}
    if(ui.tab==='report'&&parts[0]==='exams'&&parts[2]==='questions'){const qq=solQ(parts[3]);if(qq&&ui.editSol===qq.id)grabSol(qq);render();return}
    if(ui.tab==='report'&&parts[0]==='exams'&&parts.length===2){ui.coverOpen=true;if(['schoolId','grade','subject','year','semester','term'].includes(last)){render();return}refreshCover();return}
    if(parts[0]==='exams'&&parts.length===2&&['schoolId','grade','subject'].includes(last)){render();return}
    if(parts[0]==='schools'&&last==='publisher'&&ui.tab==='exam')render();
    if(parts[0]==='exams'){const e=S.exams.find(x=>x.id===parts[1]),lv=document.getElementById('live');if(lv&&e)lv.innerHTML=liveHtml(e)}
    if(last==='name'&&parts[0]==='schools'||last==='title'||last==='unit'||last==='schoolId'||last==='no')refreshLists();
  }
});
function refreshLists(){const d=document.getElementById('dl-units');if(!d)return;const tmp=document.createElement('div');tmp.innerHTML=datalists();['dl-units','dl-refs'].forEach(i=>{const n=tmp.querySelector('#'+i),o=document.getElementById(i);if(n&&o)o.innerHTML=n.innerHTML})}

function pasteImport(){
  const e=S.exams.find(x=>x.id===ui.exam),txt=document.getElementById('paste').value.trim();
  if(!e||!txt){toast('붙여넣을 내용이 없습니다.');return}
  let n=0;
  txt.split(/\r?\n/).forEach(line=>{
    const c=line.split(/\t|,/).map(s=>s.trim());if(c.length<2||!/^\d/.test(c[0]))return;
    const num=s=>s===undefined||s===''||isNaN(Number(s))?null:Number(s);
    const type=/서/.test(c[1])?'서답':'객관',diff=LEVELS.includes(c[4])?c[4]:'중',src=SOURCES.find(s=>s.replace(/[·\s]/g,'')===(c[5]||'').replace(/[·\s]/g,''))||SOURCES.find(s=>c[5]&&s.includes(c[5]))||'교과서';
    e.questions.push({id:uid(),no:Number(c[0]),type,unit:c[2]||'',topic:'',score:num(c[3]),diff,source:src,ref:'',simSchool:num(c[7]),simAcademy:num(c[8]),correctRate:num(c[6]),discrim:num(c[6])!=null&&num(c[6])<=40,key:false,solution:''});n++;
  });
  e.questions.sort((a,b)=>a.no-b.no);save();render();toast(n?`${n}문항을 추가했습니다.`:'인식된 줄이 없습니다. 번호로 시작하는 줄만 읽습니다.');
}
function reportText(){
  const e=S.exams.find(x=>x.id===ui.rep);if(!e)return'';const a=analyze(e);
  return[examLabel(e),'',...summaryLines(e,a).map(l=>'- '+l),'','[단원별]',...a.units.map(u=>`${u.u}: ${u.n}문항 ${fmt(u.score,1)}점, 고난도 ${u.high}문항(${pct(u.highScore,a.total)}%)`)].join('\n');
}
function copyReport(){
  const t=reportText();
  const fb=()=>{const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}x.remove();toast(ok?'리포트를 복사했습니다.':'복사하지 못했습니다.')};
  navigator.clipboard?.writeText(t).then(()=>toast('리포트를 복사했습니다.'),fb)||fb();
}
function exportCsv(){
  const e=S.exams.find(x=>x.id===ui.exam);if(!e)return;
  const h=['번호','유형','단원','출제포인트','배점','난이도','출처','참고자료','학교유사도','학원유사도','정답률','변별','주요'];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=e.questions.map(q=>[q.no,q.type,q.unit,q.topic,q.score,q.diff,q.source,q.ref,q.simSchool,q.simAcademy,q.correctRate,q.discrim?'Y':'',q.key?'Y':''].map(cell).join(','));
  download(examLabel(e)+'.csv','﻿'+[h.map(cell).join(','),...rows].join('\n'));
}
async function download(name,data){
  try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:name,data});toast('저장했습니다.')}
  catch(e){if(e&&e.code==='declined')return;toast('이 화면에서는 파일 저장을 사용할 수 없습니다.')}
}

function addPending(fs){

/* 파일 이름에서 학교·학년·과목·연도·학기·시험·자료 종류를 읽어 확인표를 미리 채웁니다 */
const VISUAL_KINDS=['시험지','전년도 기출','학교 프린트','모의고사 기출'];
const COMMON_KINDS=['학원 자료','모의고사 기출'];
function parseName(name){
  const n=name.replace(/\.[^.]+$/,''),o={};
  const sc=S.schools.find(s=>{const k=(s.name||'').replace(/인천|서구|고등학교|중학교|학교/g,'').trim();return k.length>=2&&n.includes(k)});
  if(sc)o.schoolId=sc.id;
  let m=n.match(/(20\d\d)\s*[-_.]\s*([1-3])\s*[-_.]\s*([12])\s*[-_.]\s*([MmFf])(?![A-Za-z])/);
  if(m){o.year=m[1];o.gradeNum=m[2];o.semester=m[3];o.term=/m/i.test(m[4])?'중간':'기말'}
  else{const y=n.match(/(20\d\d)/);if(y)o.year=y[1]}
  const g=n.match(/([고중])\s?([1-3])(?!\d)/);
  if(g)o.grade=g[1]+g[2];
  else{const g2=n.match(/([1-3])\s?학년/);const num=g2?g2[1]:o.gradeNum;if(num)o.grade=((sc&&sc.level==='중')?'중':'고')+num}
  if(!o.term){if(/중간/.test(n))o.term='중간';else if(/기말/.test(n))o.term='기말'}
  if(!o.semester){const s=n.match(/([12])\s?학기/);if(s)o.semester=s[1]}
  if(/공통\s?수학\s?(1|Ⅰ|I)(?![0-9])/.test(n))o.subject='공통수학1';
  else if(/공통\s?수학\s?(2|Ⅱ|II)/.test(n))o.subject='공통수학2';
  else if(/미적분\s?(Ⅱ|II|2)/.test(n))o.subject='미적분Ⅱ';
  else if(/미적분/.test(n))o.subject='미적분Ⅰ';
  else if(/대수/.test(n))o.subject='대수';
  else if(/확률과\s?통계|확통/.test(n))o.subject='확률과 통계';
  else if(/기하/.test(n))o.subject='기하';
  if(/교과서/.test(n))o.kind='교과서';
  else if(/부교재|워크북/.test(n))o.kind='부교재';
  else if(/프린트|학습지/.test(n))o.kind='학교 프린트';
  else if(/모의고사|모평|학평/.test(n))o.kind='모의고사 기출';
  else if(/학원|교재|캐슬/.test(n))o.kind='학원 자료';
  else if(o.year&&sc)o.kind=Number(o.year)>=new Date().getFullYear()?'시험지':'전년도 기출';
  return o;
}
function makeMeta(f){
  const p=parseName(f.name),d=ui.up;
  const kind=p.kind||d.kind;
  const defSchool=COMMON_KINDS.includes(kind)?'':(isCom(ui.school)?'':ui.school);
  const gr0=p.grade||d.grade||'';
  return{kind,schoolId:p.schoolId!==undefined?p.schoolId:defSchool,level:gr0[0]==='중'?'중':(ui.school===COM_M?'중':'고'),grade:gr0,subject:p.subject||d.subject||'',year:p.year||(kind==='전년도 기출'?'':String(d.year)),semester:p.semester||d.semester,term:p.term||d.term,visual:VISUAL_KINDS.includes(kind),detected:Object.keys(p).filter(k=>k!=='gradeNum')};
}
function pendTable(){

  const rows=ui.pending.map((it,i)=>{
    const m=it.meta,isH=/\.hwpx$/i.test(it.file.name),ex=m.kind==='시험지',bad=(ex||m.kind==='전년도 기출')&&!m.schoolId;

    <td>${ex?`<div class="st" style="flex-wrap:nowrap"><input type="number" data-pm="${i}:year" value="${esc(m.year)}" style="width:76px" aria-label="연도">${ps(i,'semester',[['1','1학기'],['2','2학기']])}${ps(i,'term',['중간','기말'])}</div>`:m.kind==='전년도 기출'?`<span class="hint">${m.year?esc(m.year)+'년 기출 (파일 이름 기준)':'연도를 읽지 못했습니다. 파일 이름에 연도(예: 2024)를 넣으세요'}</span>`:'<span class="hint">-</span>'}</td>

  return`<div class="st" style="align-items:center"><b>업로드 확인표</b><span class="hint">파일 이름에서 읽은 내용입니다. 틀린 칸만 고치고 아래 버튼을 누르세요. "수식 정확히 읽기"를 켜면 PDF를 사진으로 보고 수식까지 읽습니다(시간과 사용량이 더 듭니다). 한글(HWPX) 파일은 수식을 그대로 읽습니다.</span></div><div class="tw"><table class="pt"><thead><tr><th>파일</th><th>종류</th><th>학교</th><th>학년</th><th>과목</th><th>시험 정보</th><th title="PDF를 사진으로 보고 수식까지 정확히 읽습니다">수식 정확히 읽기</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* 현황판: 학교 × 학년·과목별로 올라간 시험·자료 수. 칸을 누르면 그 학교·학년·과목이 기본값으로 정해집니다. */
const GS_COLS=[['고1','공통수학1'],['고1','공통수학2'],['고2','대수'],['고2','미적분Ⅰ'],['고2','확률과 통계'],['고3','기하'],['고3','미적분Ⅱ']];

function gridPanel(){
  const map=new Map();GS_COLS.forEach(c=>map.set(c.join('|'),c));

  S.files.forEach(f=>{if(f.grade&&f.subject)map.set(f.grade+'|'+f.subject,[f.grade,f.subject])});
  const cols=[...map.values()].sort((a,b)=>GRADES.indexOf(a[0])-GRADES.indexOf(b[0])||String(a[1]).localeCompare(String(b[1]),'ko'));

  };
  const rows=[...S.schools.map(s=>`<tr><th>${esc(s.name||'(이름 없음)')}</th>${cols.map(c=>cell(s.id,c)).join('')}</tr>`),`<tr><th>공통 자료 · 중등</th>${cols.map(c=>cell('',c,'중')).join('')}</tr>`,`<tr><th>공통 자료 · 고등</th>${cols.map(c=>cell('',c,'고')).join('')}</tr>`].join('');
  return`<section class="panel"><header><h3>현황판</h3><span class="hint">칸을 누르면 [자료 업로드]로 이동하고, 그 학교·학년·과목이 기본값으로 정해집니다</span></header><div class="tw"><table class="gt"><thead><tr><th>학교</th>${cols.map(c=>`<th>${esc(c[0])}<br>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

async function extractFile(f,wantPages,visual){
  let x=f.name.split('.').pop().toLowerCase();
  if(!/^(txt|md|csv|png|jpg|jpeg|webp|gif|pdf|hwpx|hwp)$/.test(x))x=({'application/haansofthwpx':'hwpx','application/hwp+zip':'hwpx','application/pdf':'pdf','image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/gif':'gif','text/plain':'txt','text/markdown':'md','text/csv':'csv'})[(f.type||'').split(';')[0]]||x;
  if(['txt','md','csv'].includes(x))return{text:await f.text(),images:[],pages:[]};
  if(['png','jpg','jpeg','webp','gif'].includes(x))return{text:'',images:[f],pages:[f]};
  if(x==='hwpx')return await readHwpx(f);
  if(x==='hwp')throw new Error('HWP(.hwp) 파일은 읽을 수 없습니다. 한글에서 다른 이름으로 저장해 HWPX 또는 PDF로 올려 주세요.');
  if(x!=='pdf')throw new Error('지원하지 않는 형식입니다. PDF로 저장해 올려 주세요.');
  if(!window.pdfjsLib)throw new Error('PDF 읽기 도구를 불러오지 못했습니다. 페이지를 사진(JPG·PNG)으로 저장해 올려 주세요.');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  /* 수식 정확히 읽기: 글자가 들어 있는 PDF라도 사진으로 보고 수식까지 읽습니다 */
  if(visual){const nv=Math.min(pdf.numPages,MAXSCAN);if(pdf.numPages>nv)log(`  수식을 사진으로 읽는 파일이라 앞의 ${nv}쪽만 읽습니다. (전체 ${pdf.numPages}쪽)`);const im=await renderPages(pdf,nv);return{text:'',images:im,pages:im,visual:true}}
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();pages.push(tc.items.map(t=>t.str).join(' ').replace(/\s+/g,' ').trim())}
  if(pages.join('').length/pdf.numPages>=60)return{text:pages.map((t,i)=>`[${i+1}쪽]\n${t}`).join('\n\n'),images:[],pages:wantPages?await renderPages(pdf,Math.min(pdf.numPages,30)):[]};
  const n=Math.min(pdf.numPages,MAXSCAN);
  if(pdf.numPages>n)log(`  스캔본이라 앞의 ${n}쪽만 읽습니다. (전체 ${pdf.numPages}쪽)`);
  const imgs=await renderPages(pdf,n);
  return{text:'',images:imgs,pages:imgs};
}
async function readHwpx(f){
  if(!window.JSZip)throw new Error('HWPX 읽기 도구를 불러오지 못했습니다. 새로고침한 뒤 다시 시도하세요.');
  const z=await JSZip.loadAsync(await f.arrayBuffer());
  const names=Object.keys(z.files).filter(n=>/^Contents\/section\d+\.xml$/i.test(n)).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  if(!names.length)throw new Error('HWPX 본문을 찾지 못했습니다.');
  let out='';
  const walk=el=>{
    for(const ch of el.childNodes){
      if(ch.nodeType!==1)continue;
      const ln=ch.localName;
      if(ln==='t')out+=ch.textContent;
      else if(ln==='equation'){const s=ch.getElementsByTagNameNS('*','script')[0];out+=` [수식: ${(s?s.textContent:ch.textContent).replace(/\s+/g,' ').trim()}] `}
      else if(ln==='tab')out+=' ';
      else if(ln==='lineBreak'||ln==='br')out+='\n';
      else{walk(ch);if(ln==='p')out+='\n'}
    }
  };
  for(const n of names){
    const doc=new DOMParser().parseFromString(await z.file(n).async('string'),'application/xml');
    walk(doc.documentElement);out+='\n';
  }
  log('  한글(HWPX) 파일의 수식을 그대로 읽었습니다.');
  return{text:out.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n'),images:[],pages:[],hwpx:true};
}const MAXSCAN=600;
async function renderPages(pdf,n){
  const out=[];
  for(let i=1;i<=n;i++){
    const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2.2,1600/vp0.width)});
    const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.88)));
  }
  return out;
}
const batches=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};

async function storeText(rec,text){

  if(db){const n=Math.ceil(text.length/PART);for(let i=0;i<n;i++)await db.doc(`filetext/${rec.id}_${i}`).set({t:text.slice(i*PART,(i+1)*PART)});rec.parts=n}else rec.parts=0;
}
async function loadText(rec){

  let t='';
  if(db&&rec.parts){for(let i=0;i<rec.parts;i++){const s=await db.doc(`filetext/${rec.id}_${i}`).get();if(s.exists)t+=s.data().t}}
  return TEXTS[rec.id]=t;
}

const norm=s=>String(s).toLowerCase().replace(/[\s.,;:'"“”‘’·•\-–—_()\[\]{}<>~`!?]/g,'');
const grams=(s,n=3)=>{const g=new Set();for(let i=0;i+n<=s.length;i++)g.add(s.slice(i,i+n));return g};
function chunksOf(f,t){
  if(CH[f.id])return CH[f.id];const o=[],mk=[...t.matchAll(/\[(\d+)쪽\]|\[페이지 (\d+)[^\]]*\]/g)].map(m=>[m.index,+(m[1]||m[2])]),pgAt=p=>{let r=0;for(const [i,n] of mk){if(i<=p)r=n;else break}return r};
  for(let i=0;i<t.length;i+=250){const raw=t.slice(i,i+500);if(raw.trim().length>20)o.push({g:grams(norm(raw),2),ex:raw.replace(/\s+/g,' ').slice(0,400),pg:mk.length?pgAt(i):1,pg2:mk.length?pgAt(Math.min(t.length-1,i+499)):1,all:!mk.length})}

  let [x0,y0,x1,y1]=box.map(Number);
  x0=Math.max(0,x0-pad);y0=Math.max(0,y0-padY);x1=Math.min(1,x1+pad);y1=Math.min(1,y1+padY);
  const sw=(x1-x0)*W,sh=(y1-y0)*H;if(sw<40||sh<30)return null;
  const k=Math.min(2,1600/W),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);

  return peelCanvas(c);
}
/* 가장자리의 흰 여백과, 단 구분선·테두리 같은 긴 선(색 무관)을 걷어내 문제 부분만 남깁니다 */
function peelOnce(c){
  const g=c.getContext('2d',{willReadFrequently:true}),w=c.width,h=c.height,d=g.getImageData(0,0,w,h).data;
  /* 연한 회색 선까지 잡도록 기준을 넉넉히 둡니다 */
  const dk=(x,y)=>{if(x<0||x>=w)return false;const i=(y*w+x)*4;return d[i]<228||d[i+1]<228||d[i+2]<228};
  /* 이어진 정도가 긴 세로·가로 선인지 봅니다. 한두 픽셀 기울어져도, 군데군데 끊겨도 선으로 셉니다. */
  const vrun=x=>{let best=0,cur=0,gap=0;for(let y=0;y<h;y++){if(dk(x,y)||dk(x-1,y)||dk(x+1,y)){cur+=1+gap;gap=0;if(cur>best)best=cur}else if(cur&&++gap>3){cur=0;gap=0}}return best};
  const hrun=y=>{let best=0,cur=0,gap=0;for(let x=0;x<w;x++){const u=dk(x,y)||(y>0&&dk(x,y-1))||(y<h-1&&dk(x,y+1));if(u){cur+=1+gap;gap=0;if(cur>best)best=cur}else if(cur&&++gap>3){cur=0;gap=0}}return best};
  let l=0,r=w-1,t=0,b=h-1;
  const bw=Math.max(4,Math.floor(w*0.05)),bh=Math.max(4,Math.floor(h*0.03));
  const vl=x=>vrun(x)>=h*0.45,thinV=(x,s)=>{let n=0;for(let k=0;k<8;k++){if(vl(x+s*k))n++;else break}return n<=6};
  for(let x=0;x<bw;x++)if(vl(x)&&thinV(x,1))l=x+1;
  for(let x=w-1;x>w-1-bw;x--)if(vl(x)&&thinV(x,-1))r=x-1;
  for(let y=0;y<bh;y++)if(hrun(y)>=w*0.5)t=y+1;
  for(let y=h-1;y>h-1-bh;y--)if(hrun(y)>=w*0.5)b=y-1;
  if(r-l<40||b-t<20){l=0;r=w-1;t=0;b=h-1}
  /* 남은 가장자리의 빈 여백 정리 */
  const colInk=x=>{let n=0;for(let y=t;y<=b;y++)if(dk(x,y))n++;return n};
  const rowInk=y=>{let n=0;for(let x=l;x<=r;x++)if(dk(x,y))n++;return n};
  while(r-l>40&&colInk(l)===0)l++;
  while(r-l>40&&colInk(r)===0)r--;
  while(b-t>20&&rowInk(t)===0)t++;
  while(b-t>20&&rowInk(b)===0)b--;
  const p=8,L=Math.max(0,l-p),T=Math.max(0,t-p),R=Math.min(w-1,r+p),B=Math.min(h-1,b+p);
  const o=document.createElement('canvas');o.width=R-L+1;o.height=B-T+1;
  const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,o.width,o.height);
  /* 문제 영역 밖(선이 있던 자리)은 흰색으로 둡니다 */
  og.drawImage(c,l,t,r-l+1,b-t+1,l-L,t-T,r-l+1,b-t+1);
  return o;
}
function peelCanvas(c){
  let o=peelOnce(c);o=peelOnce(o);
  return o.toDataURL('image/jpeg',0.85);
}
function tidyImg(url){
  return new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);res(peelCanvas(c))}catch(e){res(url)}};im.onerror=()=>res(url);im.src=url});
}

const MATPDF={};
async function getMatPdf(rec){
  if(MATPDF[rec.id])return MATPDF[rec.id];
  const r=await fetch('/_blob/'+rec.assetId);if(!r.ok)throw new Error('원본 파일을 불러오지 못했습니다.');
  const buf=await (await r.blob()).arrayBuffer();
  if(new TextDecoder().decode(new Uint8Array(buf,0,4))!=='%PDF')throw new Error(`${rec.name}: PDF 파일이 아니어서 자료 문제 이미지를 만들 수 없습니다. 캡처를 붙여넣어 넣어 주세요.`);
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return MATPDF[rec.id]=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
}
async function renderOne(pdf,i){
  const pg=await pdf.getPage(i),vp0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(2.2,1600/vp0.width)});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
}

시험 문항: ${(q.stem||q.topic||'').replace(/\s+/g,' ').slice(0,400)}`,blobs);

  return true;

    const url=await toJpeg(blob);IMGS['ref_'+q.id]=url;q.refImg=true;q.refManual=true;q.refPageShown=undefined;q.cmp=true;
    if(db){try{await db.doc('qimg/ref_'+q.id).set({d:url})}catch(x){toast('자료 문제 이미지를 서버에 저장하지 못했습니다.')}}
    save();render();showPop(qid,true);toast('자료 문제 이미지를 넣고 비교란에 추가했습니다.');
  }catch(x){toast('이미지를 읽을 수 없습니다.')}
}
async function getExamPages(rec){
  if(!rec)throw new Error('시험지 파일 정보가 없습니다.');
  if(PAGES[rec.id])return PAGES[rec.id];
  if(!rec.assetId)throw new Error('원본 파일이 보관되어 있지 않습니다. [자료 업로드]에서 시험지를 다시 올리면 문항 이미지가 만들어집니다.');
  const r=await fetch('/_blob/'+rec.assetId);if(!r.ok)throw new Error('원본 파일을 불러오지 못했습니다.');
  const blob=await r.blob(),file=new File([blob],rec.name,{type:(blob.type&&blob.type!=='application/octet-stream')?blob.type:'application/pdf'});
  const src=await extractFile(file,true);
  return PAGES[rec.id]=src.pages;
}

/* ---------- PDF 저장·블로그용 복사 ---------- */
async function waitImgs(root){
  for(let k=0;k<30&&root.querySelector('img[data-qimg]:not([src])');k++)await new Promise(r=>setTimeout(r,150));
  await Promise.all([...root.querySelectorAll('img')].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
}
/* 분석지를 화면과 같은 모양으로 그려 A4 쪽 단위로 배치합니다. PDF와 블로그용 이미지가 똑같은 결과를 쓰도록 한 곳에서 만듭니다. */
async function withLightTheme(fn){
  const html=document.documentElement,prev=html.getAttribute('data-theme');
  html.setAttribute('data-theme','light');
  try{return await fn()}finally{prev==null?html.removeAttribute('data-theme'):html.setAttribute('data-theme',prev)}
}
async function layoutReport(){
  const rb=document.getElementById('report-body');
  try{return await layoutReportInner()}finally{if(rb)rb.classList.remove('compact')}
}
async function layoutReportInner(){
  const root=document.getElementById('report-body');
  if(!root)throw new Error('분석지를 찾지 못했습니다.');
  if(!window.html2canvas)throw new Error('이미지 도구를 불러오지 못했습니다. 새로고침한 뒤 다시 눌러 주세요.');
  return withLightTheme(async()=>{
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    const W=210,H=297,MX=8,MT=11,CW=W-2*MX,COM_H=H-2*MT;
    await waitImgs(root);
    const unitsOf=()=>{
      const u=[];
      [...root.children].forEach(ch=>{
        if(ch.classList.contains('noprint'))return;
        if(ch.matches('section.panel')&&ch.querySelector('.qcard')){u.push(ch.querySelector('header'));ch.querySelectorAll('.qcard').forEach(c=>u.push(c))}
        else u.push(ch);
      });
      return u;
    };
    const capture=async()=>{
      await sleep(100);
      const caps=[];
      for(const el of unitsOf()){
        const c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,ignoreElements:n=>n.classList&&n.classList.contains('noprint')});
        if(c.width&&c.height)caps.push({el,c});
      }
      return caps;
    };
    const isSim=el=>el.matches&&el.matches('section.panel')&&(el.querySelector('h3')?.textContent||'').includes('자료 유사도');
    const isKey=el=>el.matches&&(el.matches('.qcard')||(el.tagName==='HEADER'&&!!el.closest('section.panel')?.querySelector('.qcard')));
    const hAt=(x,w)=>x.c.height*w/x.c.width;
    const splitOf=caps=>{
      let s=caps.findIndex(x=>isSim(x.el));
      if(s<0){const k=caps.findIndex(x=>isKey(x.el));s=k<0?caps.length-1:k-1}
      return s;
    };
    /* 1) 보통 간격으로 그려 보고, 첫 쪽(표지~자료 유사도)이 한 쪽에 안 들어가면 촘촘한 간격으로 다시 그립니다 */
    let caps=await capture(),split=splitOf(caps);
    const baseGap=3;
    const total0=()=>caps.slice(0,split+1).reduce((t,x)=>t+hAt(x,CW)+baseGap,0)-baseGap;
    if(total0()>COM_H){
      root.classList.add('compact');
      caps=await capture();split=splitOf(caps);
    }
    const first=caps.slice(0,split+1),rest=caps.slice(split+1);
    const sumH=first.reduce((t,x)=>t+hAt(x,CW),0);
    /* 2) 필요하면 전체를 같은 비율로 줄이고(55%까지), 남는 세로 공간은 위·아래·항목 사이에 고르게 나눕니다 */
    const sc1=Math.max(0.55,Math.min(1,(COM_H-baseGap*(first.length-1))/sumH)),w1=CW*sc1;
    const hs=first.map(x=>hAt(x,w1)),tot=hs.reduce((a,b)=>a+b,0);
    const free=COM_H-tot;
    const gap=first.length>1?Math.min(10,Math.max(2,free/(first.length-1)*0.8)):0;
    const used=tot+gap*(first.length-1);
    const top=MT+Math.max(0,Math.min(14,(COM_H-used)/2));
    const x1=MX+(CW-w1)/2;
    const pages=[[]];let y=top;
    first.forEach((x,i)=>{pages[0].push({c:x.c,x:x1,y,w:w1,h:hs[i]});y+=hs[i]+gap});
    /* 3) 주요문항은 둘째 쪽부터 같은 폭으로 이어 붙이고, 쪽 끝에 닿으면 다음 쪽으로 넘깁니다 */
    if(rest.length){pages.push([]);y=MT}
    const put=(cv,w,xo,hh)=>{if(y+hh>H-MT&&pages[pages.length-1].length){pages.push([]);y=MT}pages[pages.length-1].push({c:cv,x:xo,y,w,h:hh});y+=hh+4};
    for(const x of rest){
      const c=x.c,w=CW,h=hAt(x,w);
      if(h<=COM_H)put(c,w,MX,h);
      else{
        const sliceH=Math.floor(COM_H*c.width/w);
        for(let off=0;off<c.height;off+=sliceH){
          const sl=document.createElement('canvas');sl.width=c.width;sl.height=Math.min(sliceH,c.height-off);
          sl.getContext('2d').drawImage(c,0,off,c.width,sl.height,0,0,c.width,sl.height);
          put(sl,w,MX,sl.height*w/c.width);
        }
      }
    }
    return pages.filter(p=>p.length);
  });
}function pageJpeg(items,q=0.92){
  const PX=6,cv=document.createElement('canvas');cv.width=210*PX;cv.height=297*PX;
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  items.forEach(it=>g.drawImage(it.c,it.x*PX,it.y*PX,it.w*PX,it.h*PX));
  return cv.toDataURL('image/jpeg',q);
}
async function savePdf(){
  const e=S.exams.find(x=>x.id===ui.rep);if(!e)return;
  if(!window.jspdf){toast('PDF 도구를 불러오지 못했습니다. 새로고침한 뒤 다시 눌러 주세요.');return}
  toast('PDF를 만드는 중입니다. 잠시만 기다려 주세요…');
  try{
    const pages=await layoutReport(),pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    pages.forEach((p,i)=>{if(i)pdf.addPage();pdf.addImage(pageJpeg(p),'JPEG',0,0,210,297)});
    await download(`${examLabel(e)} 분석지.pdf`,pdf.output('blob'));
  }catch(err){toast(err&&err.message?err.message:'PDF를 만들지 못했습니다. 다시 시도해 주세요.')}
}
/* 블로그용: PDF와 똑같은 쪽 이미지를 그대로 복사합니다 */
let blogImgs=[];
async function blogCopy(){
  const e=S.exams.find(x=>x.id===ui.rep);if(!e)return;
  toast('블로그용 이미지를 만드는 중입니다. 잠시만 기다려 주세요…');

    <p class="hint">PDF와 똑같은 ${blogImgs.length}쪽입니다 (로고, 제목, 표, 그래프 모두 포함). 블로그 글쓰기 화면에서 쪽마다 "이미지 복사"를 누르고 붙여넣기(Ctrl+V)를 반복하세요. 한꺼번에 올리려면 ZIP으로 저장해 사진으로 올리세요.${ok?' 전체를 한 번에 복사해 두었으니 붙여넣기가 되는지 먼저 시험해 보셔도 됩니다.':''}</p>
    <div style="display:flex;flex-wrap:wrap;gap:14px">${blogImgs.map((u,i)=>`<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><img src="${u}" alt="${i+1}쪽" style="width:230px;border:1px solid var(--line);background:#fff"><button class="btn sm pri" data-act="blog-img" data-id="${i}">${i+1}쪽 이미지 복사</button></div>`).join('')}</div></section>`;
    box.scrollIntoView({block:'start'});
  }
  toast('쪽마다 "이미지 복사"를 누르고 블로그에 붙여넣으세요.');
}
async function blogImgCopy(i){
  const u=blogImgs[i];if(!u)return;
  try{
    const img=await new Promise((r,j)=>{const m=new Image();m.onload=()=>r(m);m.onerror=j;m.src=u});
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
    toast(`${i+1}쪽 이미지를 복사했습니다. 블로그 글쓰기 화면에 붙여넣으세요.`);
  }catch(e){toast('복사가 막혀 있습니다. ZIP으로 저장해 사진으로 올려 주세요.')}
}async function blogZip(){
  if(!blogImgs.length)return;
  if(!window.JSZip){toast('ZIP 도구를 불러오지 못했습니다.');return}
  const e=S.exams.find(x=>x.id===ui.rep),z=new window.JSZip();
  blogImgs.forEach((u,i)=>z.file(`분석지_${i+1}쪽.jpg`,u.split(',')[1],{base64:true}));
  await download(`${e?examLabel(e):'분석지'} 블로그용 이미지.zip`,await z.generateAsync({type:'blob'}));
}/* ---------- 공유 저장소 연결 ---------- */
